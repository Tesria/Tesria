# A release (dev-plan 16.1): pushing a tag such as v0.5.0 runs the checks,
# builds the app image stamped with that version, and publishes a GitHub
# release whose notes are docs/CHANGELOG.md's section for it. The image is
# built to prove it builds; publishing images is a later step (Docker Hub).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build the app image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker buildx build -f deploy/Dockerfile \
            --build-arg TESRIA_VERSION="${GITHUB_REF_NAME#v}" \
            --load -t tesria:"${GITHUB_REF_NAME#v}" .

  release:
    name: Publish the release
    needs: [checks, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version: from its heading to the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/CHANGELOG.md > notes.md
          test -s notes.md || { echo "docs/CHANGELOG.md has no section for $version" >&2; exit 1; }
          # A release's notes are limited to 125,000 characters. A section
          # longer than that (0.5.0, the first, is the whole history) is cut
          # to its highlights, the text before its first entry.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            awk '/^### /{ exit } { print }' notes.md > short.md
            printf '\nThe full record is in [docs/CHANGELOG.md](%s/%s/blob/%s/docs/CHANGELOG.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> short.md
            mv short.md notes.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Tesria ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag $prerelease
