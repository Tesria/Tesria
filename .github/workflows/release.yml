# A release (dev-plan 16.1, 14.2): pushing a tag such as v0.7.0 runs the
# checks, publishes the five images to Docker Hub and GitHub's registry
# (images.yml), builds tesria-deploy.zip (everything needed to run those
# images), and publishes a GitHub release with that zip and notes from
# docs/CHANGELOG.md's section for the version. The docs are attached
# afterwards by scripts/docs/release-docs.sh, from a running instance.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  bundle:
    name: Build tesria-deploy.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bundle/deploy-bundle.mjs "${GITHUB_REF_NAME#v}" out
      - uses: actions/upload-artifact@v4
        with:
          name: tesria-deploy
          path: out/tesria-deploy.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [checks, images, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tesria-deploy
      - name: Notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version: from its heading to the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/CHANGELOG.md > notes.md
          test -s notes.md || { echo "docs/CHANGELOG.md has no section for $version" >&2; exit 1; }
          # A release's notes are limited to 125,000 characters. A section
          # longer than that (0.5.0, the first, is the whole history) is cut
          # to its highlights, the text before its first entry.
          if [ "$(wc -c < notes.md)" -gt 120000 ]; then
            awk '/^### /{ exit } { print }' notes.md > short.md
            printf '\nThe full record is in [docs/CHANGELOG.md](%s/%s/blob/%s/docs/CHANGELOG.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> short.md
            mv short.md notes.md
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Tesria ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag $prerelease tesria-deploy.zip
