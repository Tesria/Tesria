# The checks every change must pass (dev-plan 16): the backend tests, and
# the web app's build, lint and tests. The same jobs gate a release
# (release.yml). Changes to documentation alone do not run them.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'scripts/docs/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'scripts/docs/**']
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Api.Tests --nologo
      # The About tab's dependency list must match what ships.
      - name: Dependency manifest is current
        run: node scripts/deps/build-manifest.mjs --check

  # The tests SQLite cannot run: the app on real PostgreSQL as its
  # least-privilege role, where the grants are enforced (the review's
  # DATA-04). The ordinary run above skips them.
  api-postgres:
    name: API tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          # A throwaway server that lives as long as this job.
          POSTGRES_PASSWORD: tesria-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TESRIA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=tesria-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Api.Tests --nologo --filter "FullyQualifiedName~DatabaseRoleTests"

  web:
    name: Web build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
