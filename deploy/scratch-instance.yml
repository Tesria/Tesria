# A throwaway instance for testing first-run behavior (dev-plan 10.2).
#
#   scripts/scratch-instance.sh up      # build and start, on http://localhost:8099
#   scripts/scratch-instance.sh down    # stop and destroy, volumes included
#
# The database, migrate and the app, and nothing else: the setup wizard
# needs no collaboration, PDF rendering, backups or a proxy. It runs under its
# own compose project name and its own volumes, so `down -v` here can never
# touch the real instance.
#
# Plain HTTP, which is why Security__AllowInsecureCookies is on: the session
# cookie is Secure in production, and over HTTP a Secure cookie is silently
# dropped, which would make every request look signed out. That setting is
# documented as unsafe and belongs nowhere but here.
name: tesria-scratch

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scratch
      POSTGRES_PASSWORD: scratch
      POSTGRES_DB: scratch
    volumes:
      - scratchdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scratch -d scratch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The owner's work, as in the real stack (dev-plan 14.3, 14.4): since
  # 0.6.0 a production app runs only as the least-privilege role and never
  # migrates, so without this the scratch app refused to start.
  migrate:
    image: tesria-scratch-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["--migrate", "--watch"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=scratch;Username=scratch;Password=scratch"
      ConnectionStrings__App: "Host=db;Port=5432;Database=scratch;Username=tesria_app;Password=scratch-app"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tesria-migrated"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5m

  app:
    image: tesria-scratch-app
    depends_on:
      migrate:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # The least-privilege role migrate provisions; throwaway, like the rest.
      ConnectionStrings__App: "Host=db;Port=5432;Database=scratch;Username=tesria_app;Password=scratch-app"
      Collab__Secret: ""
      Oidc__Authority: ""
      Oidc__ClientId: ""
      Oidc__ClientSecret: ""
      Oidc__DisplayName: ""
      Security__AllowInsecureCookies: "true"
      Site__BaseUrl: "http://localhost:8099"
    ports:
      - "8099:8080"

volumes:
  scratchdata:
