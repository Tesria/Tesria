# pgBackRest configuration (PLAN §5, Layer 1: physical backup + PITR).
#
# This file is mounted read-only into both the `db` container (which runs
# archive-push via archive_command) and the `pgbackrest` sidecar (which runs
# stanza-create and scheduled backups). Repository encryption is supplied at
# runtime via the PGBACKREST_REPO1_CIPHER_* environment variables so the
# passphrase is never committed here.

[global]
# Local repository on a shared named volume.
repo1-path=/var/lib/pgbackrest
# Retention is the admin page's policy (Administration -> Backups, dev-plan
# 9.1). The sidecar runs `expire --repo1-retention-full=K` itself after each
# backup, with K worked out from that policy. This value only stops the
# automatic expire that follows every backup from removing anything, and it
# means a `pgbackrest backup` run by hand never expires backups either.
# 9999999 is the largest value pgBackRest accepts.
repo1-retention-full=9999999
# Compress WAL and backups; zstd is fast and dense.
compress-type=zst
compress-level=3
# Asynchronous archiving keeps archive_command fast and resilient to bursts.
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail
# Take the backup start checkpoint immediately instead of waiting.
start-fast=y

[main]
# PGDATA for postgres:18 lives in a version-specific subdirectory.
pg1-path=/var/lib/postgresql/18/docker
# Connect to Postgres over the shared unix socket (no password needed).
pg1-socket-path=/var/run/postgresql
pg1-port=5432
