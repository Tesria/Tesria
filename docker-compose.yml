# Tesria: full self-hosted stack.
#
#   docker compose up -d
#
# No .env is needed: the init service generates every secret on first start
# (dev-plan 25.1). A .env, if there is one, overrides; see .env.example.
#
# Services:
#   init        makes and keeps the secrets, then exits; everything waits for it
#   db          PostgreSQL 18 + pgBackRest (data on the `pgdata` volume)
#   app         ASP.NET Core API + React SPA (built from deploy/Dockerfile)
#   caddy       reverse proxy with automatic HTTPS
#   backup      scheduled logical backups (pg_dump) + uploads archives
#   pgbackrest  continuous physical backups + point-in-time recovery

name: tesria

# Each secret's volume, mounted read-only where a service reads it. Which
# services get which is the point (dev-plan 14.3, 25.1): the app never has
# the owner password or the backup key.
x-secret-owner: &secret-owner
  type: volume
  source: secret_postgres_password
  target: /run/tesria/postgres-password
  read_only: true
x-secret-app: &secret-app
  type: volume
  source: secret_app_db_password
  target: /run/tesria/app-db-password
  read_only: true
x-secret-backup-key: &secret-backup-key
  type: volume
  source: secret_backup_key
  target: /run/tesria/backup-key
  read_only: true
x-secret-collab: &secret-collab
  type: volume
  source: secret_collab
  target: /run/tesria/collab-secret
  read_only: true
x-secret-pdf: &secret-pdf
  type: volume
  source: secret_pdf
  target: /run/tesria/pdf-secret
  read_only: true

services:
  # Tesria's secrets (dev-plan 25.1). Uses a value set in .env; otherwise
  # keeps the one it stored before; otherwise generates one, but never for a
  # database or backups that already exist without it, and never over a
  # stored value. Refuses to start a new install on a `change-me` value.
  # Runs at every `docker compose up` and exits; see deploy/init/init.sh.
  #   docker compose run --rm init show-backup-key    prints the backup key
  init:
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-db:${TESRIA_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/tesria/init.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      COLLAB_SHARED_SECRET: ${COLLAB_SHARED_SECRET:-}
      PDF_SHARED_SECRET: ${PDF_SHARED_SECRET:-}
    volumes:
      - ./deploy/init/init.sh:/opt/tesria/init.sh:ro
      - secret_postgres_password:/run/tesria/postgres-password
      - secret_app_db_password:/run/tesria/app-db-password
      - secret_backup_key:/run/tesria/backup-key
      - secret_collab:/run/tesria/collab-secret
      - secret_pdf:/run/tesria/pdf-secret
      - install_status:/run/tesria/status
      # Read only, to tell a new install from an existing one.
      - pgdata:/pgdata:ro
      - pgbackrest:/pgbackrest:ro
      # The Tesria folder, where backup-key.txt is written for the owner.
      - .:/install

  db:
    # PostgreSQL 18 plus pgBackRest (for WAL archiving / PITR).
    # Published images (dev-plan 14.2): `docker compose pull` fetches them,
    # `up -d --build` builds them from this checkout instead. TESRIA_IMAGES
    # picks the registry (Docker Hub by default, or ghcr.io/tesria/tesria),
    # TESRIA_IMAGE_TAG the version; see .env.example.
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-db:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/db/Dockerfile
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    # Enable continuous WAL archiving via pgBackRest. archive_command runs as the
    # postgres user and reads /etc/pgbackrest/pgbackrest.conf + PGBACKREST_* env.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesria}
      POSTGRES_DB: ${POSTGRES_DB:-tesria}
      # The owner password and the backup key are files (dev-plan 25.1):
      # the entrypoint hands the first to Postgres and writes the second
      # where pgBackRest reads it.
      # Offsite backups (dev-plan 9.2). Read by deploy/pgbackrest/offsite.sh,
      # never by pgBackRest directly: an empty PGBACKREST_REPO2_* variable is a
      # hard error, and Compose cannot leave one out. Empty here simply means
      # no offsite target.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_RETENTION_FULL: ${OFFSITE_CLOUD_RETENTION_FULL:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      OFFSITE_ARCHIVE_QUEUE_MAX: ${OFFSITE_ARCHIVE_QUEUE_MAX:-}
    # Writes pgBackRest's repo2 drop-in before Postgres starts, so
    # archive_command knows about the offsite repository from the first WAL
    # segment. It never blocks the database from starting; see the script.
    entrypoint: ["/bin/bash", "/opt/tesria/db-entrypoint.sh"]
    volumes:
      # postgres:18+ stores data in a version-specific subdirectory and expects
      # the volume mounted at /var/lib/postgresql (mounting the legacy
      # /var/lib/postgresql/data path makes the image refuse to start).
      - pgdata:/var/lib/postgresql
      - ./deploy/pgbackrest:/scripts:ro
      - ./deploy/db/entrypoint.sh:/opt/tesria/db-entrypoint.sh:ro
      - ./deploy/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
      - *secret-owner
      - *secret-backup-key
    # Not healthy while a restore by hand is still resetting the owner's
    # password (see the entrypoint), so migrate does not try to sign in
    # with this machine's password before the database has it.
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /var/lib/postgresql/.tesria-reset-owner-password && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Replaying WAL after a restore takes as long as it takes; until it is
      # done the check fails, and that is not a database that is broken.
      start_period: 5m
    # Not published to the host: only the app and backup services reach it.
    expose:
      - "5432"

  # The database owner's work, done once before the app starts (dev-plan
  # 14.3): migrations, and the least-privilege role the app runs as. The same
  # image as the app, run with --migrate; it exits when done. It is the only
  # Tesria container that holds the owner's password, apart from the backup
  # services, which need it to dump and archive.
  migrate:
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-app:${TESRIA_IMAGE_TAG:-latest}
    pull_policy: missing
    # Stays up after its first pass (dev-plan 14.4): a restore asks it to
    # bring the restored copy up to date and grant the app its access, and
    # every thirty seconds it checks the live database needs neither.
    command: ["--migrate", "--watch"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Healthy once the first pass has succeeded; the image's own check is
    # for the web app, which this is not.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tesria-migrated"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 10m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The connection strings are built from these and the password files
      # (dev-plan 25.1). OwnerUser is what gives this service, alone, the
      # owner's connection.
      Database__Name: ${POSTGRES_DB:-tesria}
      Database__OwnerUser: ${POSTGRES_USER:-tesria}
      Database__AppUser: ${APP_DB_USER:-tesria_app}
    # The group the secret files belong to; this image runs as a non-root user.
    group_add: ["10203"]
    volumes:
      - *secret-owner
      - *secret-app

  app:
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-app:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      # Set by the release pipeline (dev-plan 16.1); empty for a local build.
      args:
        TESRIA_VERSION: ${TESRIA_VERSION:-}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # The least-privilege role (dev-plan 3.1), and only it (14.3): it cannot
      # alter or delete audit rows, and the owner's password is not here. Its
      # password, the collab secret (which signs the tokens that let a user
      # join a page's live editing) and the PDF secret are files (25.1).
      Database__Name: ${POSTGRES_DB:-tesria}
      Database__AppUser: ${APP_DB_USER:-tesria_app}
      # Where the app tells the sidecar that a page has been written, so an
      # editor somebody has open shows it as a tracked change instead of
      # overwriting it (dev-plan 8.6). Service name, not the public address:
      # this never leaves the compose network.
      Collab__Endpoint: "http://collab:8090"
      # Read once, on the first start after dev-plan 9.1, to seed the backup
      # retention policy; after that the policy lives on the admin page.
      Backup__SeedRetentionDays: ${BACKUP_RETENTION_DAYS:-14}
      # OIDC/SSO: empty OIDC_AUTHORITY disables it entirely (local accounts
      # only). See .env.example for the full set of variables.
      Oidc__Authority: ${OIDC_AUTHORITY:-}
      Oidc__ClientId: ${OIDC_CLIENT_ID:-}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Oidc__DisplayName: ${OIDC_DISPLAY_NAME:-}
      Oidc__RequireHttpsMetadata: ${OIDC_REQUIRE_HTTPS_METADATA:-true}
      # Which addresses may set X-Forwarded-For / X-Forwarded-Proto. By
      # default loopback and this stack's own subnet (below, dev-plan 14.3),
      # where Caddy lives. Fronting the app with a proxy elsewhere? Name that
      # proxy here instead.
      Proxy__TrustedNetworks: ${PROXY_TRUSTED_NETWORKS:-}
      Proxy__ComposeSubnet: ${TESRIA_SUBNET:-10.203.0.0/24}
      # Where links in email point. Overridable at runtime in Admin → Settings.
      Pdf__Endpoint: "http://pdf:8091"
      Site__BaseUrl: "https://${DOMAIN:-localhost}"
      # Which Caddyfile is in use: the default one makes its own certificate,
      # and then the app offers /trust to each device (dev-plan 15.5).
      Tls__Caddyfile: ${CADDYFILE:-deploy/Caddyfile}
      # Where the app reads the public root of Caddy's own certificate
      # authority, to show its fingerprint (dev-plan 14.4). The compose
      # network only; the app never sees the authority's key.
      Tls__AuthorityCertificateUrl: "http://caddy/ca.crt"
      # Where the optional Tailscale sidecar leaves its status (dev-plan
      # 19.1), for the Tailscale card in Administration. Only a file: the app
      # never gets Tailscale's control socket.
      Tailscale__StatusFile: /tailscale-status/status.json
    group_add: ["10203"]
    volumes:
      - uploads:/app/uploads
      - tailscale_status:/tailscale-status:ro
      - *secret-app
      - *secret-collab
      - *secret-pdf
      # What init found (dev-plan 25.1): whether it made the backup key, and
      # any secret still set to an example value. Nothing secret.
      - install_status:/run/tesria/status:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Optional: Let's Encrypt accepts an account with no email.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # The Tailscale container's fixed address, whose X-Forwarded-For Caddy
      # believes (real addresses for tailnet visitors, 2026-09-24).
      TESRIA_TAILSCALE_ADDRESS: ${TESRIA_TAILSCALE_ADDRESS:-10.203.0.250}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # deploy/Caddyfile is the LAN/dev configuration (internal CA, catch-all
      # for LAN IPs). Set CADDYFILE=deploy/Caddyfile.public in .env when the
      # server is reachable from the internet: see docs/security.md.
      - ./${CADDYFILE:-deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # postgres:18 plus restic; see deploy/backup/Dockerfile for why restic.
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-backup:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-tesria}
      # libpq's password file, written by init (dev-plan 25.1). A file named
      # in the environment rather than a variable, so a command run later
      # with `docker compose exec` finds it too.
      PGPASSFILE: /run/tesria/postgres-password/pgpass
      PGDATABASE: ${POSTGRES_DB:-tesria}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Retention is not set here any more: it is the policy on the admin
      # page (dev-plan 9.1), which this sidecar reads from the database.
      # Offsite (dev-plan 9.2): the same slots the pgbackrest sidecar reads,
      # but this one carries the files rather than the database. Empty means
      # no offsite target, and nothing is copied anywhere.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      # Path targets (9.2 steps 3 and 4). The host path is passed through
      # only so the screen can name it; what the sidecar writes to is the
      # bind mount below.
      OFFSITE_NAS_PATH: ${OFFSITE_NAS_PATH:-}
      # How long a scheduled copy waits after a target could not be reached.
      OFFSITE_RETRY_MINUTES: ${OFFSITE_RETRY_MINUTES:-15}
      OFFSITE_NAS_PASSPHRASE: ${OFFSITE_NAS_PASSPHRASE:-}
      OFFSITE_REMOVABLE_PATH: ${OFFSITE_REMOVABLE_PATH:-}
      OFFSITE_REMOVABLE_PASSPHRASE: ${OFFSITE_REMOVABLE_PASSPHRASE:-}
      OFFSITE_DRILL_DAYS: ${OFFSITE_DRILL_DAYS:-30}
    entrypoint: ["/bin/bash", "/scripts/run.sh"]
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/offsite.sh:/opt/tesria/offsite.sh:ro
      # How often the offsite copies are proved restorable (9.2 step 6).

      - backups:/backups
      # Read-write since dev-plan 9.4: restoring a backup puts the attachments
      # back, which means moving the current ones aside and extracting the
      # archive over them. Read-only was right while this sidecar only ever
      # took backups; it is now the one thing that can put them back, and a
      # database restored without its attachments is a wiki full of broken
      # links.
      - uploads:/data/uploads
      # No drive is mounted here (dev-plan 24.2): the network and removable
      # drives have services of their own, below, so that a drive that is
      # not there when the stack starts cannot stop this one.
      - *secret-owner
    # The loop touches this every minute, even in the middle of a long backup.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # The network drive (dev-plan 9.2 step 3) and the removable drive (step 4),
  # each copied to by a service of its own (deploy/backup/drive.sh).
  #
  # A bind mount, not a cifs/nfs volume: a named network volume stops the
  # container starting while the share is down. And on Docker Desktop for
  # Mac even a bind mount does, when its folder is missing: Docker cannot
  # create a folder under /Volumes, so a share that is not connected, or a
  # drive that is not plugged in, stops the container from starting. That is
  # why each drive has its own container (T8-026): a missing drive stops
  # only its own, the local backups carry on, and the `backup` service
  # reports it on the drive's card. `docker compose up -d` once the drive is
  # back starts it. Where the folder is there, the sentinel file inside
  # decides whether anything is written. With no drive configured, the path
  # defaults to a directory with no sentinel, and the service idles.
  backup-nas: &drive-service
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-backup:${TESRIA_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &drive-environment
      OFFSITE_SLOT: nas
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-tesria}
      PGPASSFILE: /run/tesria/postgres-password/pgpass
      PGDATABASE: ${POSTGRES_DB:-tesria}
      OFFSITE_NAS_PATH: ${OFFSITE_NAS_PATH:-}
      OFFSITE_NAS_PASSPHRASE: ${OFFSITE_NAS_PASSPHRASE:-}
      OFFSITE_REMOVABLE_PATH: ${OFFSITE_REMOVABLE_PATH:-}
      OFFSITE_REMOVABLE_PASSPHRASE: ${OFFSITE_REMOVABLE_PASSPHRASE:-}
      OFFSITE_RETRY_MINUTES: ${OFFSITE_RETRY_MINUTES:-15}
      OFFSITE_DRILL_DAYS: ${OFFSITE_DRILL_DAYS:-30}
    entrypoint: ["/bin/bash", "/scripts/drive.sh"]
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/offsite.sh:/opt/tesria/offsite.sh:ro
      # What is copied: read only, since this service never writes a backup.
      - backups:/backups:ro
      - uploads:/data/uploads:ro
      - ${OFFSITE_NAS_PATH:-./deploy/backup/no-target}:/mnt/nas
      - *secret-owner
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  backup-removable:
    <<: *drive-service
    environment:
      <<: *drive-environment
      OFFSITE_SLOT: removable
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/offsite.sh:/opt/tesria/offsite.sh:ro
      - backups:/backups:ro
      - uploads:/data/uploads:ro
      - ${OFFSITE_REMOVABLE_PATH:-./deploy/backup/no-target}:/mnt/removable
      - *secret-owner

  collab:
    # Real-time co-editing (Yjs/Hocuspocus). The editor engine is JS-only, so
    # this is isolated in a Node sidecar (PLAN §1) rather than in the .NET app.
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-collab:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: collab/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The migrate step provisions the role this sidecar signs in with; the
      # app being healthy means it has.
      app:
        condition: service_healthy
    environment:
      COLLAB_PORT: 8090
      # Where this asks whether a connection may stand (dev-plan 14.4). The
      # compose network, never the public address.
      APP_URL: "http://app:8080"
      # The same least-privilege role as the app, and only it (dev-plan 14.3).
      # Its password and the shared secret are files (25.1).
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-tesria}
      PGUSER: ${APP_DB_USER:-tesria_app}
    group_add: ["10203"]
    volumes:
      - *secret-app
      - *secret-collab
    expose:
      - "8090"

  pdf:
    # PDF export (dev-plan 8.1). A real browser engine is the only honest way
    # to turn the print-ready HTML export into a PDF, and a ~400MB Chromium
    # has no business inside the app image, so it is a sidecar, like collab.
    #
    # It is handed a self-contained document (images inlined, diagrams
    # carrying their own renderer) and runs with its network switched off,
    # so rendering never reaches anything.
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-pdf:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: pdf/Dockerfile
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PDF_PORT: 8091
    # The shared secret is a file (dev-plan 25.1).
    group_add: ["10203"]
    volumes:
      - *secret-pdf
    expose:
      - "8091"
    # Chromium wants more than Docker's default 64MB of shared memory.
    shm_size: 256mb

  pgbackrest:
    # Physical backups + PITR (PLAN §5, Layer 1). Same image as db so it has the
    # pgBackRest binary; shares the repo, the data dir (read-only), and the
    # Postgres socket so it can run backups as the postgres user.
    image: ${TESRIA_IMAGES:-brianintheloop/tesria}-db:${TESRIA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/db/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-PGBACKREST_ prefix so pgBackRest's option parser ignores it.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_FULL_EVERY_DAYS: ${BACKUP_FULL_EVERY_DAYS:-7}
      # psql, for reporting to the app's backup tables (dev-plan 9.1). libpq
      # reads these only for what pgBackRest does not set itself.
      PGHOST: /var/run/postgresql
      PGUSER: ${POSTGRES_USER:-tesria}
      PGDATABASE: ${POSTGRES_DB:-tesria}
      # Connect as the instance superuser over the socket (there is no "postgres"
      # role: the superuser is POSTGRES_USER). The password file covers scram
      # auth; the backup key is written into pgBackRest's configuration by
      # run.sh (dev-plan 25.1).
      PGBACKREST_PG1_USER: ${POSTGRES_USER:-tesria}
      PGPASSFILE: /run/tesria/postgres-password/pgpass
      OFFSITE_CLOUD_BACKUP_EVERY_DAYS: ${OFFSITE_CLOUD_BACKUP_EVERY_DAYS:-7}
      # Optional: gives the cloud card's chart a "free" slice (dev-plan 9.3).
      OFFSITE_CLOUD_BUDGET_GB: ${OFFSITE_CLOUD_BUDGET_GB:-}
      # Offsite backups (dev-plan 9.2). Read by deploy/pgbackrest/offsite.sh,
      # never by pgBackRest directly: an empty PGBACKREST_REPO2_* variable is a
      # hard error, and Compose cannot leave one out. Empty here simply means
      # no offsite target.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_RETENTION_FULL: ${OFFSITE_CLOUD_RETENTION_FULL:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      OFFSITE_ARCHIVE_QUEUE_MAX: ${OFFSITE_ARCHIVE_QUEUE_MAX:-}
    entrypoint: ["/bin/bash", "/scripts/run.sh"]
    volumes:
      - ./deploy/pgbackrest:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
      - pgdata:/var/lib/postgresql:ro
      - *secret-owner
      - *secret-backup-key
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # An S3 server on the laptop, so the offsite path (dev-plan 9.2) can be
  # built and tested without a cloud account, a card, or the internet. Off by
  # default: `docker compose --profile offsite-test up -d minio`.
  # See deploy/pgbackrest/README.md for the two commands that set it up.
  # Reaching Tesria from anywhere on your tailnet (dev-plan 19.1), off
  # unless asked for:  docker compose --profile tailscale up -d
  # It joins your tailnet as TS_HOSTNAME (default "tesria") and serves
  # https://<that name>.<your tailnet>.ts.net with a certificate Tailscale
  # provisions, forwarding to Caddy so /collab and everything else is routed
  # exactly as on the LAN. Serve only, never Funnel: deploy/tailscale/
  # serve.json turns Funnel off, so nothing is published to the internet.
  # Needs TS_AUTHKEY in .env (Tailscale admin console, Settings, Keys) and
  # HTTPS turned on for the tailnet (DNS page). See the docs page
  # "Reaching Tesria from anywhere with Tailscale".
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    restart: unless-stopped
    depends_on:
      - caddy
    hostname: ${TS_HOSTNAME:-tesria}
    # A fixed address, the one Caddy believes X-Forwarded-For from, so a
    # tailnet visitor is recorded by their own tailnet address. Inside
    # TESRIA_SUBNET: change both together.
    networks:
      default:
        ipv4_address: ${TESRIA_TAILSCALE_ADDRESS:-10.203.0.250}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-tesria}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun or extra privileges needed,
      # and Serve works the same.
      TS_USERSPACE: "true"
    volumes:
      # The device's identity: kept so a restart is the same device, and the
      # auth key is needed only for the first start.
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
      - tailscale_status:/status
    # The check doubles as the status report: this device only (no peers),
    # written where the app can read it for its Tailscale card.
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json --peers=false > /status/status.tmp && mv /status/status.tmp /status/status.json"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  minio:
    # quay.io, not Docker Hub: MinIO's Hub images are no longer public
    # ("pull access denied"), and quay.io is where the project publishes.
    image: quay.io/minio/minio:latest
    profiles: ["offsite-test"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesria-test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesria-test-secret}
    volumes:
      - minio:/data
      # pgBackRest speaks TLS to S3 and has no plain-HTTP option, so even a
      # test server needs a certificate. Generated by minio-certs.sh.
      - minio_certs:/root/.minio/certs
    # Published on the host so the setup command can reach it; the sidecars
    # reach it by service name on the compose network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # -k because the certificate is self-signed; this is the test harness.
      test: ["CMD", "curl", "-fsk", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

# The stack's own network, on a fixed subnet (dev-plan 14.3), so the app can
# trust forwarded addresses from exactly this range rather than from every
# private one. Change TESRIA_SUBNET if it collides with a network you already
# use (a VPN, say). Changing it needs `docker compose down` (never `down -v`)
# and `docker compose up -d`, because Docker recreates the network.
networks:
  default:
    ipam:
      config:
        - subnet: ${TESRIA_SUBNET:-10.203.0.0/24}

volumes:
  # One per secret (dev-plan 25.1), so each can be mounted only where it is
  # needed. Deleting these deletes the secrets: `down -v` on an install whose
  # secrets were generated leaves a database nothing can open.
  secret_postgres_password:
  secret_app_db_password:
  secret_backup_key:
  secret_collab:
  secret_pdf:
  install_status:
  tailscale_state:
  tailscale_status:
  minio:
  minio_certs:
  pgdata:
  uploads:
  backups:
  pgbackrest:
  pgsocket:
  caddy_data:
  caddy_config:
