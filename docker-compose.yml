# Tesria: full self-hosted stack.
#
#   cp .env.example .env      # then edit secrets
#   docker compose up -d
#
# Services:
#   db          PostgreSQL 18 + pgBackRest (data on the `pgdata` volume)
#   app         ASP.NET Core API + React SPA (built from deploy/Dockerfile)
#   caddy       reverse proxy with automatic HTTPS
#   backup      scheduled logical backups (pg_dump) + uploads archives
#   pgbackrest  continuous physical backups + point-in-time recovery

name: tesria

services:
  db:
    # PostgreSQL 18 plus pgBackRest (for WAL archiving / PITR).
    build:
      context: .
      dockerfile: deploy/db/Dockerfile
    restart: unless-stopped
    # Enable continuous WAL archiving via pgBackRest. archive_command runs as the
    # postgres user and reads /etc/pgbackrest/pgbackrest.conf + PGBACKREST_* env.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY}
      # Offsite backups (dev-plan 9.2). Read by deploy/pgbackrest/offsite.sh,
      # never by pgBackRest directly: an empty PGBACKREST_REPO2_* variable is a
      # hard error, and Compose cannot leave one out. Empty here simply means
      # no offsite target.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_RETENTION_FULL: ${OFFSITE_CLOUD_RETENTION_FULL:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      OFFSITE_ARCHIVE_QUEUE_MAX: ${OFFSITE_ARCHIVE_QUEUE_MAX:-}
    # Writes pgBackRest's repo2 drop-in before Postgres starts, so
    # archive_command knows about the offsite repository from the first WAL
    # segment. It never blocks the database from starting; see the script.
    entrypoint: ["/bin/bash", "/opt/tesria/db-entrypoint.sh"]
    volumes:
      # postgres:18+ stores data in a version-specific subdirectory and expects
      # the volume mounted at /var/lib/postgresql (mounting the legacy
      # /var/lib/postgresql/data path makes the image refuse to start).
      - pgdata:/var/lib/postgresql
      - ./deploy/pgbackrest:/scripts:ro
      - ./deploy/db/entrypoint.sh:/opt/tesria/db-entrypoint.sh:ro
      - ./deploy/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app and backup services reach it.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      # Owner connection: migrations and role provisioning at startup only.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Runtime connection: a least-privilege role the app creates on start
      # (dev-plan 3.1). It cannot alter or delete audit rows. An empty
      # APP_DB_PASSWORD falls back to the owner with a warning.
      ConnectionStrings__App: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER:-tesria_app};Password=${APP_DB_PASSWORD:-}"
      # Shared with the collab sidecar; signs the tokens that authorize a user
      # to join a page's live editing session. Empty disables co-editing.
      Collab__Secret: ${COLLAB_SHARED_SECRET}
      # Where the app tells the sidecar that a page has been written, so an
      # editor somebody has open shows it as a tracked change instead of
      # overwriting it (dev-plan 8.6). Service name, not the public address:
      # this never leaves the compose network.
      Collab__Endpoint: "http://collab:8090"
      # Read once, on the first start after dev-plan 9.1, to seed the backup
      # retention policy; after that the policy lives on the admin page.
      Backup__SeedRetentionDays: ${BACKUP_RETENTION_DAYS:-14}
      # OIDC/SSO: empty OIDC_AUTHORITY disables it entirely (local accounts
      # only). See .env.example for the full set of variables.
      Oidc__Authority: ${OIDC_AUTHORITY}
      Oidc__ClientId: ${OIDC_CLIENT_ID}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET}
      Oidc__DisplayName: ${OIDC_DISPLAY_NAME}
      Oidc__RequireHttpsMetadata: ${OIDC_REQUIRE_HTTPS_METADATA:-true}
      # Which addresses may set X-Forwarded-For / X-Forwarded-Proto. The
      # default covers the private ranges Docker allocates the compose
      # network from, which is safe only while port 8080 stays unpublished.
      # Fronting the app with a proxy elsewhere? Name that proxy here.
      Proxy__TrustedNetworks: ${PROXY_TRUSTED_NETWORKS:-}
      # Where links in email point. Overridable at runtime in Admin → Settings.
      Pdf__Endpoint: "http://pdf:8091"
      Pdf__SharedSecret: ${PDF_SHARED_SECRET:-}
      Site__BaseUrl: "https://${DOMAIN}"
      # Which Caddyfile is in use: the default one makes its own certificate,
      # and then the app offers /trust to each device (dev-plan 15.5).
      Tls__Caddyfile: ${CADDYFILE:-deploy/Caddyfile}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # deploy/Caddyfile is the LAN/dev configuration (internal CA, catch-all
      # for LAN IPs). Set CADDYFILE=deploy/Caddyfile.public in .env when the
      # server is reachable from the internet: see docs/security.md.
      - ./${CADDYFILE:-deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # postgres:18 plus restic; see deploy/backup/Dockerfile for why restic.
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS}
      # Retention is not set here any more: it is the policy on the admin
      # page (dev-plan 9.1), which this sidecar reads from the database.
      # Offsite (dev-plan 9.2): the same slots the pgbackrest sidecar reads,
      # but this one carries the files rather than the database. Empty means
      # no offsite target, and nothing is copied anywhere.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      # Path targets (9.2 steps 3 and 4). The host path is passed through
      # only so the screen can name it; what the sidecar writes to is the
      # bind mount below.
      OFFSITE_NAS_PATH: ${OFFSITE_NAS_PATH:-}
      # How long a scheduled copy waits after a target could not be reached.
      OFFSITE_RETRY_MINUTES: ${OFFSITE_RETRY_MINUTES:-15}
      OFFSITE_NAS_PASSPHRASE: ${OFFSITE_NAS_PASSPHRASE:-}
      OFFSITE_REMOVABLE_PATH: ${OFFSITE_REMOVABLE_PATH:-}
      OFFSITE_REMOVABLE_PASSPHRASE: ${OFFSITE_REMOVABLE_PASSPHRASE:-}
      OFFSITE_DRILL_DAYS: ${OFFSITE_DRILL_DAYS:-30}
    entrypoint: ["/bin/bash", "/scripts/run.sh"]
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/offsite.sh:/opt/tesria/offsite.sh:ro
      # How often the offsite copies are proved restorable (9.2 step 6).

      - backups:/backups
      # Read-write since dev-plan 9.4: restoring a backup puts the attachments
      # back, which means moving the current ones aside and extracting the
      # archive over them. Read-only was right while this sidecar only ever
      # took backups; it is now the one thing that can put them back, and a
      # database restored without its attachments is a wiki full of broken
      # links.
      - uploads:/data/uploads
      # A bind mount, not a cifs/nfs volume, and that is the decision: a
      # named network volume stops the container starting while the share is
      # down, which would take the LOCAL backups down with it. A bind mount
      # always starts, and the sentinel file inside decides whether anything
      # is written. Defaults to a directory with no sentinel, so an instance
      # with no network drive reports it absent and copies nothing.
      - ${OFFSITE_NAS_PATH:-./deploy/backup/no-target}:/mnt/nas
      - ${OFFSITE_REMOVABLE_PATH:-./deploy/backup/no-target}:/mnt/removable
    # The loop touches this every minute, even in the middle of a long backup.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  collab:
    # Real-time co-editing (Yjs/Hocuspocus). The editor engine is JS-only, so
    # this is isolated in a Node sidecar (PLAN §1) rather than in the .NET app.
    build:
      context: .
      dockerfile: collab/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The app provisions the runtime role this sidecar signs in with.
      app:
        condition: service_healthy
    environment:
      COLLAB_PORT: 8090
      COLLAB_SHARED_SECRET: ${COLLAB_SHARED_SECRET}
      # Same least-privilege role as the app; falls back to the owner when
      # APP_DB_PASSWORD is empty (see server.js).
      DATABASE_URL: "postgres://${APP_DB_USER:-tesria_app}:${APP_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}"
      DATABASE_URL_FALLBACK: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    expose:
      - "8090"

  pdf:
    # PDF export (dev-plan 8.1). A real browser engine is the only honest way
    # to turn the print-ready HTML export into a PDF, and a ~400MB Chromium
    # has no business inside the app image, so it is a sidecar, like collab.
    #
    # It is handed a self-contained document (images inlined, diagrams
    # carrying their own renderer) and runs with its network switched off,
    # so rendering never reaches anything.
    build:
      context: .
      dockerfile: pdf/Dockerfile
    restart: unless-stopped
    environment:
      PDF_PORT: 8091
      PDF_SHARED_SECRET: ${PDF_SHARED_SECRET:-}
    expose:
      - "8091"
    # Chromium wants more than Docker's default 64MB of shared memory.
    shm_size: 256mb

  pgbackrest:
    # Physical backups + PITR (PLAN §5, Layer 1). Same image as db so it has the
    # pgBackRest binary; shares the repo, the data dir (read-only), and the
    # Postgres socket so it can run backups as the postgres user.
    build:
      context: .
      dockerfile: deploy/db/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-PGBACKREST_ prefix so pgBackRest's option parser ignores it.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS}
      BACKUP_FULL_EVERY_DAYS: ${BACKUP_FULL_EVERY_DAYS:-7}
      # psql, for reporting to the app's backup tables (dev-plan 9.1). libpq
      # reads these only for what pgBackRest does not set itself.
      PGHOST: /var/run/postgresql
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      # Connect as the instance superuser over the socket (there is no "postgres"
      # role: the superuser is POSTGRES_USER). PGPASSWORD covers scram auth.
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_KEY}
      OFFSITE_CLOUD_BACKUP_EVERY_DAYS: ${OFFSITE_CLOUD_BACKUP_EVERY_DAYS:-7}
      # Optional: gives the cloud card's chart a "free" slice (dev-plan 9.3).
      OFFSITE_CLOUD_BUDGET_GB: ${OFFSITE_CLOUD_BUDGET_GB:-}
      # Offsite backups (dev-plan 9.2). Read by deploy/pgbackrest/offsite.sh,
      # never by pgBackRest directly: an empty PGBACKREST_REPO2_* variable is a
      # hard error, and Compose cannot leave one out. Empty here simply means
      # no offsite target.
      OFFSITE_CLOUD_TYPE: ${OFFSITE_CLOUD_TYPE:-}
      OFFSITE_CLOUD_ENDPOINT: ${OFFSITE_CLOUD_ENDPOINT:-}
      OFFSITE_CLOUD_BUCKET: ${OFFSITE_CLOUD_BUCKET:-}
      OFFSITE_CLOUD_REGION: ${OFFSITE_CLOUD_REGION:-}
      OFFSITE_CLOUD_PATH: ${OFFSITE_CLOUD_PATH:-}
      OFFSITE_CLOUD_URI_STYLE: ${OFFSITE_CLOUD_URI_STYLE:-}
      OFFSITE_CLOUD_KEY: ${OFFSITE_CLOUD_KEY:-}
      OFFSITE_CLOUD_SECRET: ${OFFSITE_CLOUD_SECRET:-}
      OFFSITE_CLOUD_PASSPHRASE: ${OFFSITE_CLOUD_PASSPHRASE:-}
      OFFSITE_CLOUD_RETENTION_FULL: ${OFFSITE_CLOUD_RETENTION_FULL:-}
      OFFSITE_CLOUD_VERIFY_TLS: ${OFFSITE_CLOUD_VERIFY_TLS:-}
      OFFSITE_ARCHIVE_QUEUE_MAX: ${OFFSITE_ARCHIVE_QUEUE_MAX:-}
    entrypoint: ["/bin/bash", "/scripts/run.sh"]
    volumes:
      - ./deploy/pgbackrest:/scripts:ro
      - ./deploy/backup/common.sh:/opt/tesria/common.sh:ro
      - ./deploy/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest:/var/lib/pgbackrest
      - pgsocket:/var/run/postgresql
      - pgdata:/var/lib/postgresql:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # An S3 server on the laptop, so the offsite path (dev-plan 9.2) can be
  # built and tested without a cloud account, a card, or the internet. Off by
  # default: `docker compose --profile offsite-test up -d minio`.
  # See deploy/pgbackrest/README.md for the two commands that set it up.
  minio:
    # quay.io, not Docker Hub: MinIO's Hub images are no longer public
    # ("pull access denied"), and quay.io is where the project publishes.
    image: quay.io/minio/minio:latest
    profiles: ["offsite-test"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tesria-test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tesria-test-secret}
    volumes:
      - minio:/data
      # pgBackRest speaks TLS to S3 and has no plain-HTTP option, so even a
      # test server needs a certificate. Generated by minio-certs.sh.
      - minio_certs:/root/.minio/certs
    # Published on the host so the setup command can reach it; the sidecars
    # reach it by service name on the compose network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # -k because the certificate is self-signed; this is the test harness.
      test: ["CMD", "curl", "-fsk", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  minio:
  minio_certs:
  pgdata:
  uploads:
  backups:
  pgbackrest:
  pgsocket:
  caddy_data:
  caddy_config:
