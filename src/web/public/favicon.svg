<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Tesria">
  <!--
    Tesria's mark: a stack of layers. Same drawing language as the app's own icon set
    (24x24, round caps/joins): the stroke is widened from the brand's 1.8 to 2
    here because a favicon renders at 16px, where 1.8 on a 24 viewBox thins out
    to roughly a single pixel and the middle layer lines start to disappear.

    An SVG favicon can carry its own media query, so the mark brightens on a
    dark browser chrome. Where that isn't supported the plain `stroke` below
    still applies, so the fallback is the brand blue rather than nothing.
  -->
  <style>
    path {
      fill: none;
      stroke: #2496ed;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      path { stroke: #6cb6f7; }
    }
  </style>
  <path d="M12 3l8 4.5-8 4.5-8-4.5L12 3z" />
  <path d="M4 12l8 4.5 8-4.5M4 16.5L12 21l8-4.5" />
</svg>
