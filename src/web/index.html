<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161a1d" />
    <title>Tesria</title>
    <!--
      Applies the theme and accent before first paint. Without this the
      document renders light for one frame and then flips, the classic
      dark-mode flash, because the stylesheet cannot read localStorage and
      React has not mounted yet. Deliberately inline and synchronous: a
      deferred or module script runs too late to help.

      The instance's branding (dev-plan 13.1) arrives as attributes the
      server writes onto <html>: data-theme-lock and data-accent-lock hold
      everyone to a theme or accent, data-accent-default is what a newcomer
      gets, and data-brand-accent-* say a custom "brand" accent exists. They
      are attributes, not values in this script, because the CSP allows this
      script by its hash: its text must be identical on every instance.

      Storage is read through a guard so that a browser blocking site data
      still gets the locks, which do not depend on storage at all.

      The storage keys and attribute logic are duplicated from src/theme.ts;
      change them together.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        function stored(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        var theme = root.getAttribute('data-theme-lock') || stored('tesria-theme');
        if (theme === 'light' || theme === 'dark') {
          root.setAttribute('data-theme', theme);
        }
        var brand = root.hasAttribute('data-brand-accent-light') || root.hasAttribute('data-brand-accent-dark');
        function valid(a) {
          return /^(blue|teal|green|purple|orange|magenta)$/.test(a || '') || (a === 'brand' && brand);
        }
        var accent = root.getAttribute('data-accent-lock');
        if (!valid(accent)) accent = stored('tesria-accent');
        if (!valid(accent)) accent = root.getAttribute('data-accent-default');
        if (valid(accent) && accent !== 'blue') {
          root.setAttribute('data-accent', accent);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
